#definir el tipo de base de datos a trabajar
quarkus.datasource.db-kind=postgresql
#usuario con el que se va a conectar a la base de datos
quarkus.datasource.username=postgres
#password del usuario de conexion (contraseña de la pc)
quarkus.datasource.password=postgres

#url de conexion a la base de datos
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/prueba

#en que escenario se va a sincronizar el codigo con la base de datos
#quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.database.generation=update

#cada vez que se ejecute la app
#este comando hace que se muestre en la consola las consolas sql
quarkus.hibernate-orm.log.sql=true

