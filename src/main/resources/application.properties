#Definimos el tipo de base de datos 
quarkus.datasource.db-kind=postgresql
#usuario con el que se conecta a la base de datos
quarkus.datasource.username=postgres
#contraseña del usuario con el que se conecta
quarkus.datasource.password=Alex1234
#url de conexion a la base de datos
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pa2db
#sincroniza el codigo con la base datos
quarkus.hibernate-orm.database.generation=update
#muestra en la consola de quarkus (mi aplicacion) el sql que se esta ejecutando en la base de datos
quarkus.hibernate-orm.log.sql=true
#ejecuta el script import.sql al iniciar la aplicacion
#quarkus.hibernate-orm.sql-load-script=import.sql